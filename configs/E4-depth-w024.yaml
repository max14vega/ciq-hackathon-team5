version: v4
jobs:
  depth:
    image:
      uri: docker://nvcr.io/nvidia/pytorch:25.10-py3
    resource:
      cpu:
        cores: 12
      memory:
        size: 48GB
      devices:
        nvidia.com/gpu: 1
    task-array:
      start: 1
      end: 3
      concurrency: 2
    script: >
      #!/bin/bash

      set -uo pipefail

      SEG=w024

      STARTS=(4 6 8)                       # shallower / default / deeper (model
      needs 17 layers)

      LS=${STARTS[$((FB_TASK_ID-1))]}

      source /data/venv/bin/activate

      cd /data/villa/ink-detection

      CKPT=/data/models/ink_9um/hybrid_3d2d-seed42/step-075000.pth

      OUT=/data/results/E4-depth/$SEG; mkdir -p $OUT

      START=$(date +%s)

      # try "end inclusive" first; if the tool rejects it, retry "end exclusive"

      for LE in $((LS+16)) $((LS+17)); do
        TAG=$(printf "L%02d-%02d" $LS $((LS+16)))
        echo "task=$FB_TASK_ID layers --layer-start $LS --layer-end $LE -> $TAG node=$(hostname)"
        python -m koine_machines.inference.infer /data/segments/$SEG/surface.zarr "$CKPT" \
          $OUT/${SEG}__ck075k__${TAG}.tif --no-compile --num-workers 8 --batch-size 128 \
          --layer-start $LS --layer-end $LE 2>&1 | tee $OUT/log_${TAG}.txt | grep -E "Selected source layer|Wrote|Error|error" || true
        [ -f $OUT/${SEG}__ck075k__${TAG}.tif ] && break
      done

      END=$(date +%s)

      printf
      '{"experiment":"E4-depth","task":%s,"layers":"%s","start":%d,"end":%d,"wall_clock_s":%d}\n'
      \
        $FB_TASK_ID $TAG $START $END $((END-START)) | tee $OUT/timing_${TAG}.json
      [ -f $OUT/${SEG}__ck075k__${TAG}.tif ]
    mounts:
      /data:
        volume: data
  analyze:
    image:
      uri: docker://nvcr.io/nvidia/pytorch:25.10-py3
    resource:
      cpu:
        cores: 8
      memory:
        size: 48GB
    script: |
      #!/bin/bash
      set -euo pipefail
      source /data/venv/bin/activate
      python - /data/results/E4-depth/w024 w024 <<'EOF'
      import sys, glob, json, itertools, os
      import numpy as np, tifffile
      from PIL import Image
      d, seg = sys.argv[1], sys.argv[2]
      out
    depends-on:
      - name: depth
        status: FINISHED
    mounts:
      /data:
        volume: data
volumes:
  data:
    name: prometheus-data
    use: team5
